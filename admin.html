<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Panel — Shahriyor Portfolio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%2300f5d4'/%3E%3Ctext x='50' y='68' font-size='54' font-family='sans-serif' font-weight='800' fill='%23050510' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E" />
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@500;600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --neon:#00f5d4; --neon2:#7b2ff7; --neon3:#f72585;
  --bg:#050510; --bg2:#0a0a1a; --bg3:#0f0f2a;
  --text:#e8e8ff; --muted:#6868a0; --card:#0d0d20; --border:#1a1a3a;
  --r:16px; --ease:cubic-bezier(.4,0,.2,1);
}
*{margin:0; padding:0; box-sizing:border-box}
body{font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; line-height:1.5}
a{color:inherit; text-decoration:none}
button{font-family:inherit; cursor:pointer}
::selection{background:var(--neon); color:#000}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--neon); border-radius:3px}

/* ---------- LOGIN ---------- */
#loginScreen{
  position:fixed; inset:0; background:var(--bg); z-index:1000;
  display:flex; align-items:center; justify-content:center; transition:.5s var(--ease);
  background-image:radial-gradient(circle at 20% 20%, rgba(123,47,247,.15), transparent 50%), radial-gradient(circle at 80% 80%, rgba(0,245,212,.1), transparent 50%);
}
.login-box{
  background:var(--card); border:1px solid var(--border); border-radius:20px; padding:3rem;
  width:100%; max-width:420px; text-align:center; box-shadow:0 30px 70px rgba(0,0,0,.5);
}
.login-mark{width:56px; height:56px; margin:0 auto 1.2rem; border-radius:16px; background:linear-gradient(135deg,var(--neon),var(--neon2)); display:grid; place-items:center; font-family:'Syne',sans-serif; font-weight:800; font-size:24px; color:#000}
.login-eyebrow{font-family:'Space Mono',monospace; color:var(--neon); margin-bottom:.6rem; font-size:.75rem; letter-spacing:.1em}
.login-box h1{font-family:'Syne',sans-serif; font-size:1.7rem; font-weight:800; margin-bottom:.4rem; letter-spacing:-.5px}
.login-box p{color:var(--muted); font-size:.85rem; margin-bottom:1.6rem}
.login-input-wrap{position:relative}
.login-input{
  width:100%; background:rgba(255,255,255,.03); border:1px solid var(--border); border-radius:10px;
  padding:14px 44px 14px 18px; color:#fff; font-family:'Space Mono',monospace; font-size:.95rem;
  margin:0 0 1.3rem; outline:none; transition:.3s;
}
.login-input:focus{border-color:var(--neon); background:rgba(0,245,212,.05); box-shadow:0 0 0 3px rgba(0,245,212,.1)}
.toggle-pass{position:absolute; right:14px; top:14px; background:none; border:none; color:var(--muted); font-size:.85rem}
.login-btn{
  width:100%; background:linear-gradient(135deg,var(--neon),#04d8bb); color:#04121a; border:none;
  padding:14px; border-radius:10px; font-weight:800; font-size:.95rem; font-family:'Syne',sans-serif;
  cursor:pointer; transition:.3s; box-shadow:0 0 24px rgba(0,245,212,.25);
}
.login-btn:hover{transform:translateY(-2px); box-shadow:0 10px 34px rgba(0,245,212,.35)}
.login-err{color:var(--neon3); font-size:.8rem; margin-top:.9rem; min-height:16px}

/* ---------- LAYOUT ---------- */
#adminPanel{display:none; opacity:0; transition:.5s}
.admin-header{
  padding:1.1rem 2.2rem; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;
  background:rgba(5,5,16,.85); backdrop-filter:blur(16px); position:sticky; top:0; z-index:100; flex-wrap:wrap; gap:12px;
}
.header-info{display:flex; align-items:center; gap:1rem; flex-wrap:wrap}
.hdr-mark{width:34px; height:34px; border-radius:9px; background:linear-gradient(135deg,var(--neon),var(--neon2)); display:grid; place-items:center; font-family:'Syne',sans-serif; font-weight:800; font-size:15px; color:#000}
.status-dot{width:8px; height:8px; background:var(--neon); border-radius:50%; box-shadow:0 0 10px var(--neon); animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.status-live{display:flex; align-items:center; gap:8px; font-family:'Space Mono',monospace; font-size:.72rem; letter-spacing:.06em; color:var(--muted)}
.clock{font-family:'Space Mono',monospace; font-size:.78rem; color:var(--muted)}
.header-actions{display:flex; gap:.7rem; flex-wrap:wrap}
.btn-action{
  background:var(--bg3); border:1px solid var(--border); color:var(--text); padding:9px 15px; border-radius:8px;
  font-size:.78rem; font-weight:600; cursor:pointer; transition:.2s; display:inline-flex; align-items:center; gap:6px; text-decoration:none;
}
.btn-action:hover{background:var(--border); border-color:var(--muted)}
.btn-action.primary:hover{border-color:var(--neon); color:var(--neon)}
.btn-action.danger:hover{border-color:var(--neon3); color:var(--neon3)}
.admin-body{padding:2rem clamp(1rem,3vw,2.5rem); max-width:1300px; margin:0 auto}

/* ---------- STATS ---------- */
.stats-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:1.1rem; margin-bottom:2.2rem}
.stat-card{background:var(--card); border:1px solid var(--border); border-radius:var(--r); padding:1.3rem 1.4rem; position:relative; overflow:hidden}
.stat-card::after{content:''; position:absolute; inset:0; background:linear-gradient(135deg,rgba(0,245,212,.06),transparent 60%); pointer-events:none}
.stat-val{font-size:1.9rem; font-weight:800; font-family:'Space Mono',monospace; color:var(--neon)}
.stat-card.new .stat-val{color:var(--neon3)}
.stat-card.read .stat-val{color:#7b2ff7}
.stat-card.today .stat-val{color:#22d3ee}
.stat-label{color:var(--muted); font-size:.72rem; text-transform:uppercase; letter-spacing:.08em; margin-top:.3rem}

/* ---------- CONTROLS ---------- */
.controls{display:flex; gap:.8rem; flex-wrap:wrap; margin-bottom:1.6rem; align-items:center}
.search-wrap{position:relative; flex:1; min-width:220px}
.search-input{
  width:100%; background:var(--card); border:1px solid var(--border); border-radius:10px; padding:11px 16px 11px 38px;
  color:#fff; font-size:.85rem; outline:none; transition:.2s;
}
.search-input:focus{border-color:var(--neon)}
.search-ico{position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:.85rem}
.filter-tabs{display:flex; gap:.5rem; flex-wrap:wrap}
.filter-tab{background:var(--card); border:1px solid var(--border); color:var(--muted); padding:9px 16px; border-radius:100px; font-size:.78rem; font-weight:600; transition:.2s}
.filter-tab.on{background:var(--neon); color:#04121a; border-color:var(--neon)}

/* ---------- MESSAGES ---------- */
.msg-grid{display:grid; grid-template-columns:1fr; gap:1.2rem}
.msg-card{background:var(--card); border:1px solid var(--border); border-radius:var(--r); overflow:hidden; transition:.25s; position:relative}
.msg-card:hover{border-color:var(--muted); transform:translateY(-2px)}
.msg-card.unread{border-left:3px solid var(--neon)}
.msg-card.unread::after{content:'YANGI'; position:absolute; top:1.1rem; right:1.1rem; background:var(--neon); color:#000; font-size:.6rem; font-weight:900; padding:3px 7px; border-radius:5px; letter-spacing:.03em}
.msg-header{padding:1.2rem 1.3rem .8rem; display:flex; gap:.9rem; align-items:flex-start}
.avatar{width:42px; height:42px; border-radius:12px; flex-shrink:0; display:grid; place-items:center; font-family:'Syne',sans-serif; font-weight:800; font-size:1rem; color:#000; background:linear-gradient(135deg,var(--neon),#04d8bb)}
.msg-sender-info h3{font-size:1.05rem; font-weight:800; font-family:'Syne',sans-serif; margin-bottom:.25rem; padding-right:70px}
.msg-meta{font-family:'Space Mono',monospace; font-size:.72rem; color:var(--muted); display:flex; gap:1.1rem; flex-wrap:wrap}
.msg-date{font-family:'Space Mono',monospace; font-size:.7rem; color:var(--muted); margin-left:auto; white-space:nowrap; padding-top:2px}
.msg-content{padding:0 1.3rem 1rem; line-height:1.65; color:#c0c0e0; font-size:.9rem}
.msg-subject{color:var(--neon); font-size:.75rem; margin-bottom:.4rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em}
.msg-tags{display:flex; gap:6px; flex-wrap:wrap; padding:0 1.3rem 1rem}
.msg-tag{font-size:.65rem; color:var(--muted); border:1px solid var(--border); padding:3px 9px; border-radius:100px; font-family:'Space Mono',monospace}
.msg-footer{padding:.9rem 1.3rem; background:rgba(255,255,255,.02); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px}
.msg-actions{display:flex; gap:.6rem; flex-wrap:wrap}
.msg-read-badge{color:var(--muted); font-size:.68rem; display:flex; align-items:center; gap:5px}

.empty-state{text-align:center; padding:4.5rem 1rem; color:var(--muted)}
.empty-ico{font-size:3rem; margin-bottom:1rem; opacity:.6}
.empty-state h3{font-family:'Syne',sans-serif; color:var(--text); margin-bottom:.4rem}

/* ---------- SKELETON ---------- */
.sk-card{background:var(--card); border:1px solid var(--border); border-radius:var(--r); padding:1.3rem; height:130px}
.sk-line{height:12px; border-radius:6px; margin-bottom:10px; background:linear-gradient(90deg,rgba(255,255,255,.04) 25%,rgba(255,255,255,.09) 37%,rgba(255,255,255,.04) 63%); background-size:400% 100%; animation:skAnim 1.4s ease infinite}
@keyframes skAnim{0%{background-position:100% 50%}100%{background-position:0 50%}}

/* ---------- TOAST ---------- */
.toast{
  position:fixed; bottom:1.6rem; right:1.6rem; z-index:9999; padding:1rem 1.4rem; background:var(--neon);
  color:#04121a; border-radius:10px; font-size:.85rem; font-weight:700; display:none; align-items:center; gap:10px;
  box-shadow:0 12px 34px rgba(0,0,0,.4); animation:slideIn .3s var(--ease);
}
@keyframes slideIn{from{transform:translateX(120px); opacity:0}to{transform:translateX(0); opacity:1}}

/* ---------- MODAL ---------- */
.modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,.6); backdrop-filter:blur(4px); z-index:2000; display:none; align-items:center; justify-content:center; padding:20px}
.modal-overlay.on{display:flex}
.modal-box{background:var(--card); border:1px solid var(--border); border-radius:18px; padding:2rem; max-width:380px; width:100%; text-align:center}
.modal-ico{font-size:2.2rem; margin-bottom:.8rem}
.modal-box h3{font-family:'Syne',sans-serif; font-size:1.2rem; margin-bottom:.5rem}
.modal-box p{color:var(--muted); font-size:.85rem; margin-bottom:1.6rem}
.modal-actions{display:flex; gap:.7rem; justify-content:center}
.modal-actions .btn-action{padding:11px 22px}

@media(max-width:640px){
  .msg-header{flex-wrap:wrap}
  .msg-date{margin-left:0; padding-top:0}
  .msg-sender-info h3{padding-right:0}
}
</style>
</head>
<body>

<div id="toast" class="toast"></div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-ico">🗑️</div>
    <h3 id="modalTitle">Xabarni o'chirish</h3>
    <p id="modalText">Bu amalni bekor qilib bo'lmaydi. Davom etasizmi?</p>
    <div class="modal-actions">
      <button class="btn-action" id="modalCancel">Bekor qilish</button>
      <button class="btn-action danger" id="modalConfirm" style="border-color:var(--neon3); color:var(--neon3)">O'chirish</button>
    </div>
  </div>
</div>

<div id="loginScreen">
  <div class="login-box">
    <div class="login-mark">A</div>
    <div class="login-eyebrow">SYSTEM_AUTH_REQUIRED</div>
    <h1>Admin Panel</h1>
    <p>Portfolio xabarlar bazasini boshqarish</p>
    <div class="login-input-wrap">
      <input type="password" id="passInput" class="login-input" placeholder="Parolni kiriting..." autofocus />
      <button class="toggle-pass" id="togglePass" type="button">👁</button>
    </div>
    <button class="login-btn" id="loginBtn">Tizimga kirish →</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<div id="adminPanel">
  <header class="admin-header">
    <div class="header-info">
      <div class="hdr-mark">A</div>
      <div class="status-live"><span class="status-dot"></span> REALTIME FAOL</div>
      <div class="clock" id="clock">--:--:--</div>
    </div>
    <div class="header-actions">
      <button onclick="refreshMessages()" class="btn-action">↻ Yangilash</button>
      <button onclick="exportCSV()" class="btn-action">⬇ Eksport</button>
      <button onclick="clearAllMessages()" class="btn-action danger">🗑 Hammasini tozalash</button>
      <button onclick="logout()" class="btn-action">⎋ Chiqish</button>
    </div>
  </header>

  <main class="admin-body">
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-val" id="stat-total">0</div><div class="stat-label">Jami xabarlar</div></div>
      <div class="stat-card new"><div class="stat-val" id="stat-new">0</div><div class="stat-label">Yangi xabarlar</div></div>
      <div class="stat-card read"><div class="stat-val" id="stat-read">0</div><div class="stat-label">O'qilgan xabarlar</div></div>
      <div class="stat-card today"><div class="stat-val" id="stat-today">0</div><div class="stat-label">Bugungi xabarlar</div></div>
    </div>

    <div class="controls">
      <div class="search-wrap">
        <span class="search-ico">🔍</span>
        <input type="text" class="search-input" id="searchInput" placeholder="Ism, email, telefon yoki mavzu bo'yicha qidirish..." />
      </div>
      <div class="filter-tabs">
        <button class="filter-tab on" data-filter="all">Barchasi</button>
        <button class="filter-tab" data-filter="new">Yangi</button>
        <button class="filter-tab" data-filter="read">O'qilgan</button>
        <button class="filter-tab" data-filter="today">Bugungi</button>
      </div>
    </div>

    <div id="messagesContainer" class="msg-grid">
      <div class="sk-card"><div class="sk-line" style="width:40%"></div><div class="sk-line" style="width:70%"></div><div class="sk-line" style="width:55%"></div></div>
      <div class="sk-card"><div class="sk-line" style="width:35%"></div><div class="sk-line" style="width:65%"></div><div class="sk-line" style="width:50%"></div></div>
    </div>
  </main>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDJVrSYuWF5Xgj2hoRSil-IaR9lYknBHM0",
    authDomain: "portfolio-2c967.firebaseapp.com",
    databaseURL: "https://portfolio-2c967-default-rtdb.firebaseio.com",
    projectId: "portfolio-2c967",
    storageBucket: "portfolio-2c967.firebasestorage.app",
    messagingSenderId: "205928792319",
    appId: "1:205928792319:web:6f570dc374276bb25dccca",
    measurementId: "G-JVVVRJGKF0"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  let allMessages = [];
  let currentFilter = 'all';
  let currentSearch = '';
  let knownIds = new Set();
  let firstLoad = true;

  /* ---------- AUTH ---------- */
  window.checkAuth = () => {
    const input = document.getElementById('passInput').value;
    const errEl = document.getElementById('loginErr');
    if (input === "w777") {
      sessionStorage.setItem('admin_auth', '1');
      const ls = document.getElementById('loginScreen');
      const ap = document.getElementById('adminPanel');
      ls.style.opacity = '0';
      setTimeout(() => {
        ls.style.display = 'none';
        ap.style.display = 'block';
        setTimeout(() => ap.style.opacity = '1', 50);
        loadMessages();
        startClock();
      }, 500);
    } else {
      errEl.textContent = "Parol noto'g'ri! Qayta urinib ko'ring.";
      document.getElementById('passInput').value = '';
      document.getElementById('passInput').focus();
    }
  };

  document.getElementById('loginBtn').addEventListener('click', checkAuth);
  document.getElementById('passInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') checkAuth(); });
  document.getElementById('togglePass').addEventListener('click', () => {
    const inp = document.getElementById('passInput');
    inp.type = inp.type === 'password' ? 'text' : 'password';
  });

  window.logout = () => {
    sessionStorage.removeItem('admin_auth');
    location.reload();
  };

  // Persist session across refresh (still requires password on new tab/browser)
  if (sessionStorage.getItem('admin_auth') === '1') {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('adminPanel').style.display = 'block';
    document.getElementById('adminPanel').style.opacity = '1';
    loadMessages();
    startClock();
  }

  /* ---------- CLOCK ---------- */
  function startClock(){
    function tick(){
      document.getElementById('clock').textContent = new Date().toLocaleTimeString('uz-UZ');
    }
    tick(); setInterval(tick, 1000);
  }

  /* ---------- NOTIFICATION SOUND (Web Audio, no external file) ---------- */
  function playNotifySound(){
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.18, ctx.currentTime + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.4);
      o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + 0.4);
      setTimeout(()=>{
        const o2 = ctx.createOscillator(); const g2 = ctx.createGain();
        o2.type='sine'; o2.frequency.value=1180;
        g2.gain.setValueAtTime(0.0001, ctx.currentTime);
        g2.gain.exponentialRampToValueAtTime(0.16, ctx.currentTime+0.02);
        g2.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.35);
        o2.connect(g2); g2.connect(ctx.destination);
        o2.start(); o2.stop(ctx.currentTime+0.35);
      }, 150);
    } catch(e) {}
  }

  /* ---------- LOAD MESSAGES (REALTIME) ---------- */
  function loadMessages() {
    const messagesRef = ref(db, 'messages');
    onValue(messagesRef, (snapshot) => {
      const data = snapshot.val();
      const messages = data ? Object.keys(data).map(key => ({ ...data[key], firebaseKey: key })) : [];

      if (!firstLoad) {
        const newOnes = messages.filter(m => !knownIds.has(m.firebaseKey));
        if (newOnes.length > 0) {
          playNotifySound();
          showToast(`📩 Sizga yangi xabar keldi: ${newOnes[0].name || 'Mehmon'}`);
        }
      }
      knownIds = new Set(messages.map(m => m.firebaseKey));
      firstLoad = false;

      allMessages = messages.sort((a,b) => (b.date||0) - (a.date||0) || new Date(b.date) - new Date(a.date));
      renderAll();
    });
  }

  function isToday(ts){
    if(!ts) return false;
    const d = new Date(ts);
    const now = new Date();
    return d.toDateString() === now.toDateString();
  }

  function renderAll(){
    const total = allMessages.length;
    const unread = allMessages.filter(m=>!m.read).length;
    const read = total - unread;
    const today = allMessages.filter(m=>isToday(m.date)).length;
    document.getElementById('stat-total').textContent = total;
    document.getElementById('stat-new').textContent = unread;
    document.getElementById('stat-read').textContent = read;
    document.getElementById('stat-today').textContent = today;

    let filtered = allMessages;
    if (currentFilter === 'new') filtered = filtered.filter(m=>!m.read);
    if (currentFilter === 'read') filtered = filtered.filter(m=>m.read);
    if (currentFilter === 'today') filtered = filtered.filter(m=>isToday(m.date));
    if (currentSearch) {
      const q = currentSearch.toLowerCase();
      filtered = filtered.filter(m =>
        (m.name||'').toLowerCase().includes(q) ||
        (m.email||'').toLowerCase().includes(q) ||
        (m.phone||'').toLowerCase().includes(q) ||
        (m.subject||'').toLowerCase().includes(q)
      );
    }
    renderMessages(filtered);
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str == null ? '' : String(str);
    return d.innerHTML;
  }

  function renderMessages(messages) {
    const container = document.getElementById('messagesContainer');

    if (!allMessages.length) {
      container.innerHTML = `<div class="empty-state"><div class="empty-ico">📭</div><h3>Hozircha xabarlar yo'q</h3><p>Sizga yozishsa, shu yerda paydo bo'ladi.</p></div>`;
      return;
    }
    if (!messages.length) {
      container.innerHTML = `<div class="empty-state"><div class="empty-ico">🔍</div><h3>Hech narsa topilmadi</h3><p>Qidiruv yoki filtr shartlarini o'zgartirib ko'ring.</p></div>`;
      return;
    }

    container.innerHTML = messages.map(m => {
      const initial = (m.name || '?').trim().charAt(0).toUpperCase();
      const dateStr = m.date ? new Date(m.date).toLocaleString('uz-UZ') : '—';
      const deviceTags = [m.device, m.browser, m.platform].filter(Boolean);
      return `
      <div class="msg-card ${!m.read ? 'unread' : ''}">
        <div class="msg-header">
          <div class="avatar">${escapeHtml(initial)}</div>
          <div class="msg-sender-info" style="flex:1">
            <h3>${escapeHtml(m.name)}</h3>
            <div class="msg-meta">
              <span>📧 ${escapeHtml(m.email)}</span>
              <span>📞 ${escapeHtml(m.phone)}</span>
            </div>
          </div>
          <div class="msg-date">${dateStr}</div>
        </div>
        <div class="msg-content">
          <div class="msg-subject">MAVZU: ${escapeHtml(m.subject)}</div>
          ${escapeHtml(m.message)}
        </div>
        ${deviceTags.length ? `<div class="msg-tags">${deviceTags.map(t=>`<span class="msg-tag">${escapeHtml(t)}</span>`).join('')}</div>` : ''}
        <div class="msg-footer">
          <div class="msg-actions">
            ${!m.read ? `<button onclick="markRead('${m.firebaseKey}')" class="btn-action primary">✓ O'qildi deb belgilash</button>` : ''}
            <a href="mailto:${encodeURIComponent(m.email)}" class="btn-action">✉ Email javob</a>
            <button onclick="replyTelegram('${escapeAttr(m.name)}')" class="btn-action">💬 TG orqali</button>
            <button onclick="copyMessage('${m.firebaseKey}')" class="btn-action">⧉ Nusxalash</button>
            <button onclick="askDelete('${m.firebaseKey}')" class="btn-action danger">🗑 O'chirish</button>
          </div>
          ${m.read ? `<span class="msg-read-badge">✓ Ko'rildi</span>` : ''}
        </div>
      </div>`;
    }).join('');
  }

  function escapeAttr(str){ return String(str||'').replace(/'/g, "\\'"); }

  window.markRead = (key) => {
    update(ref(db, 'messages/' + key), { read: true });
    showToast("✓ O'qildi deb belgilandi");
  };

  window.copyMessage = (key) => {
    const m = allMessages.find(x => x.firebaseKey === key);
    if (!m) return;
    const text = `Ism: ${m.name}\nEmail: ${m.email}\nTelefon: ${m.phone}\nMavzu: ${m.subject}\nXabar: ${m.message}`;
    navigator.clipboard.writeText(text).then(()=> showToast("⧉ Nusxalandi"));
  };

  window.replyTelegram = (name) => {
    window.open(`https://t.me/shaxriiyor`, '_blank');
  };

  let pendingDeleteKey = null;
  let pendingClearAll = false;
  const overlay = document.getElementById('modalOverlay');

  window.askDelete = (key) => {
    pendingDeleteKey = key; pendingClearAll = false;
    document.getElementById('modalTitle').textContent = "Xabarni o'chirish";
    document.getElementById('modalText').textContent = "Bu xabarni o'chirmoqchimisiz? Bu amalni bekor qilib bo'lmaydi.";
    overlay.classList.add('on');
  };
  window.clearAllMessages = () => {
    pendingClearAll = true; pendingDeleteKey = null;
    document.getElementById('modalTitle').textContent = "Barcha xabarlarni tozalash";
    document.getElementById('modalText').textContent = "Barcha xabarlar butunlay o'chiriladi. Bu amalni bekor qilib bo'lmaydi!";
    overlay.classList.add('on');
  };
  document.getElementById('modalCancel').addEventListener('click', ()=> overlay.classList.remove('on'));
  document.getElementById('modalConfirm').addEventListener('click', ()=>{
    if (pendingClearAll) {
      remove(ref(db, 'messages'));
      showToast("Barcha xabarlar o'chirildi");
    } else if (pendingDeleteKey) {
      remove(ref(db, 'messages/' + pendingDeleteKey));
      showToast("Xabar o'chirildi");
    }
    overlay.classList.remove('on');
  });

  window.refreshMessages = () => { showToast("Yangilandi ✓"); };

  window.exportCSV = () => {
    if (!allMessages.length) { showToast("Eksport uchun xabar yo'q"); return; }
    const headers = ['Ism','Email','Telefon','Mavzu','Xabar','Sana','Holat'];
    const rows = allMessages.map(m => [
      m.name, m.email, m.phone, m.subject, (m.message||'').replace(/\n/g,' '),
      m.date ? new Date(m.date).toLocaleString('uz-UZ') : '', m.read ? "O'qilgan" : 'Yangi'
    ]);
    const csv = [headers, ...rows].map(r => r.map(v => `"${String(v||'').replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob(["\uFEFF"+csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'xabarlar.csv'; a.click();
    URL.revokeObjectURL(url);
    showToast("⬇ CSV yuklab olindi");
  };

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.display = 'flex';
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.style.display = 'none', 3200);
  }

  /* ---------- SEARCH + FILTER ---------- */
  document.getElementById('searchInput').addEventListener('input', (e)=>{
    currentSearch = e.target.value.trim();
    renderAll();
  });
  document.querySelectorAll('.filter-tab').forEach(tab=>{
    tab.addEventListener('click', ()=>{
      document.querySelectorAll('.filter-tab').forEach(t=>t.classList.remove('on'));
      tab.classList.add('on');
      currentFilter = tab.dataset.filter;
      renderAll();
    });
  });
</script>
</body>
</html>
