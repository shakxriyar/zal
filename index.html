<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitTracker - Aqlli Kaloriya Nazorati</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --success: #10b981;
            --bg-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8fafc;
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .phone-container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            overflow: hidden;
            border: 1px solid #f1f5f9;
        }

        .app-header {
            background: var(--bg-gradient);
            color: white;
            padding: 30px 20px;
            text-align: center;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
        }

        .app-header h2 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
        }

        .app-header p {
            margin: 5px 0 0;
            font-size: 14px;
            opacity: 0.9;
        }

        .app-body {
            padding: 20px;
        }

        .card {
            background: #f8fafc;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid #e2e8f0;
        }

        .card h3 {
            margin-top: 0;
            font-size: 16px;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 4px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            box-sizing: border-box;
            outline: none;
            transition: all 0.2s;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .btn:hover {
            background: var(--primary-dark);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-ai {
            background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%);
            margin-top: 8px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            text-align: center;
            margin-top: 10px;
        }

        .stat-item {
            background: white;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
        }

        .stat-item span {
            display: block;
            font-size: 11px;
            color: var(--text-muted);
        }

        .stat-item b {
            font-size: 14px;
            color: var(--primary);
        }

        .progress-circle {
            text-align: center;
            padding: 10px;
        }

        .progress-number {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary);
        }

        .history-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 150px;
            overflow-y: auto;
        }

        .history-item {
            background: white;
            padding: 10px 12px;
            margin-bottom: 6px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #e2e8f0;
            font-size: 13px;
        }

        .file-upload-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .file-upload-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }

        .file-fake-btn {
            display: block;
            width: 100%;
            padding: 10px;
            background: #f1f5f9;
            border: 1px dashed #cbd5e1;
            text-align: center;
            border-radius: 10px;
            color: var(--text-muted);
            font-size: 13px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<div class="phone-container">
    <div class="app-header">
        <h2>✨ FitTracker AI</h2>
        <p>Sog'lom turmush tarzi va ozish nazorati</p>
    </div>

    <div class="app-body">
        
        <div class="card">
            <h3>⚙️ Tana parametrlari</h3>
            <div class="grid-2">
                <div class="form-group">
                    <label>Yoshingiz</label>
                    <input type="number" id="age" value="14">
                </div>
                <div class="form-group">
                    <label>Bo'y (m)</label>
                    <input type="number" step="0.01" id="height" value="1.55">
                </div>
            </div>
            <div class="grid-2">
                <div class="form-group">
                    <label>Joriy vazn (kg)</label>
                    <input type="number" id="weight" value="53">
                </div>
                <div class="form-group">
                    <label>Maqsad (kg)</label>
                    <input type="number" id="target-weight" value="46">
                </div>
            </div>
            <button class="btn" onclick="calculatePlan()">Hisoblash va Saqlash</button>
        </div>

        <div class="card" id="result-section" style="display:none;">
            <h3>📊 Kunlik rejangiz</h3>
            <div class="stats-grid">
                <div class="stat-item">
                    <span>Kaloriya</span>
                    <b id="res-kcal">0</b>
                </div>
                <div class="stat-item">
                    <span>Oqsil</span>
                    <b id="res-protein">0g</b>
                </div>
                <div class="stat-item">
                    <span>Yog'</span>
                    <b id="res-fat">0g</b>
                </div>
            </div>
            <p style="text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 10px;">
                Maqsadga erishish vaqti: <b><span id="res-time">0</span> hafta</b>
            </p>
        </div>

        <div class="card">
            <h3>🍏 Kunlik hisob</h3>
            <div class="progress-circle">
                <span>Qolgan kaloriya</span>
                <div class="progress-number"><span id="remaining-kcal">0</span> <span style="font-size: 14px; font-weight: normal; color: var(--text-muted);">kkal</span></div>
            </div>

            <div class="form-group" style="margin-top: 12px;">
                <div class="file-upload-wrapper">
                    <div class="file-fake-btn" id="file-label">📷 Ovqat rasmini tanlang</div>
                    <input type="file" id="food-image" accept="image/*" onchange="updateFileName()">
                </div>
                <button class="btn btn-ai" onclick="simulateAIFoodCheck()">Rasm tahlil qilish (AI)</button>
            </div>

            <h4 style="font-size: 13px; margin: 15px 0 8px; color: var(--text-muted);">Bugungi yeyilganlar:</h4>
            <ul id="history-list" class="history-list">
                </ul>
        </div>

    </div>
</div>

<script>
    window.onload = function() {
        checkMidnightReset();
        loadData();
    };

    function calculatePlan() {
        let age = parseFloat(document.getElementById('age').value);
        let height = parseFloat(document.getElementById('height').value) * 100;
        let weight = parseFloat(document.getElementById('weight').value);
        let targetWeight = parseFloat(document.getElementById('target-weight').value);

        let bmr = 10 * weight + 6.25 * height - 5 * age + 5;
        let dailyCalories = Math.round(bmr * 1.2 - 400);

        let protein = Math.round(weight * 1.5);
        let fat = Math.round(weight * 0.8);

        let weightDiff = weight - targetWeight;
        let weeks = weightDiff > 0 ? Math.round(weightDiff / 0.5) : 0;

        document.getElementById('res-kcal').innerText = dailyCalories;
        document.getElementById('res-protein').innerText = protein + 'g';
        document.getElementById('res-fat').innerText = fat + 'g';
        document.getElementById('res-time').innerText = weeks;
        
        document.getElementById('result-section').style.display = 'block';

        localStorage.setItem('dailyKcalLimit', dailyCalories);
        localStorage.setItem('lastDate', new Date().toLocaleDateString());
        updateRemainingDisplay();
    }

    function updateFileName() {
        let fileInput = document.getElementById('food-image');
        let label = document.getElementById('file-label');
        if(fileInput.files.length > 0) {
            label.innerText = "✅ " + fileInput.files[0].name;
        }
    }

    function simulateAIFoodCheck() {
        let fileInput = document.getElementById('food-image');
        if(fileInput.files.length === 0) {
            alert("Iltimos, avval ovqat rasmini tanlang, dadajon!");
            return;
        }

        let recognizedFood = "Tovuq go'shti va salat";
        let foodKcal = 320;

        let historyItem = {
            name: recognizedFood,
            kcal: foodKcal,
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };

        let history = JSON.parse(localStorage.getItem('foodHistory')) || [];
        history.push(historyItem);
        localStorage.setItem('foodHistory', JSON.stringify(history));

        let consumed = parseInt(localStorage.getItem('consumedKcal')) || 0;
        consumed += foodKcal;
        localStorage.setItem('consumedKcal', consumed);

        loadData();
        alert(`AI tahlili: ${recognizedFood} (${foodKcal} kkal) qo'shildi!`);
        
        // Reset file input
        fileInput.value = '';
        document.getElementById('file-label').innerText = "📷 Ovqat rasmini tanlang";
    }

    function loadData() {
        let limit = parseInt(localStorage.getItem('dailyKcalLimit')) || 1610;
        let consumed = parseInt(localStorage.getItem('consumedKcal')) || 0;
        let remaining = limit - consumed;
        if(remaining < 0) remaining = 0;

        document.getElementById('remaining-kcal').innerText = remaining;

        let history = JSON.parse(localStorage.getItem('foodHistory')) || [];
        let listHTML = '';
        if(history.length === 0) {
            listHTML = '<li class="history-item" style="justify-content: center; color: var(--text-muted);">Hozircha ovqatlar qo\'shilmagan</li>';
        } else {
            history.forEach(item => {
                listHTML += `<li class="history-item"><span><b>${item.name}</b> <br><small style="color:var(--text-muted);">${item.time}</small></span><span style="color:var(--primary); font-weight:600;">+${item.kcal} kkal</span></li>`;
            });
        }
        document.getElementById('history-list').innerHTML = listHTML;
    }

    function updateRemainingDisplay() {
        loadData();
    }

    function checkMidnightReset() {
        let lastDate = localStorage.getItem('lastDate');
        let currentDate = new Date().toLocaleDateString();

        if (lastDate !== currentDate) {
            localStorage.setItem('consumedKcal', 0);
            localStorage.setItem('foodHistory', JSON.stringify([]));
            localStorage.setItem('lastDate', currentDate);
        }
    }
</script>

</body>
</html>
